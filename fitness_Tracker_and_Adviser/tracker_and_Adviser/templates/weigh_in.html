<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Weigh-in | FitTrack Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 3rem 2.5rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        h1 {
            color: #1a1a1a;
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: #6b7280;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-label {
            display: block;
            color: #374151;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 1rem 1.25rem;
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1.25rem;
            font-weight: 600;
            transition: all 0.3s ease;
            outline: none;
            text-align: center;
        }

        .form-input:focus {
            background: white;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
        }

        .cancel-btn {
            display: inline-block;
            color: #6b7280;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .cancel-btn:hover {
            color: #374151;
        }

        .messages {
            margin-bottom: 1.5rem;
        }

        .messages .error {
            background: #fee2e2;
            color: #dc2626;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.875rem;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⚖️</div>
        <h1>Weekly Weigh-in</h1>
        <p class="subtitle">Log your current weight to monitor your progress and keep your plan accurate.</p>
        
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="{% if message.tags %}{{ message.tags }}{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="weight">Current Weight (kg)</label>
                <input 
                    type="number" 
                    step="0.1" 
                    id="weight" 
                    name="weight" 
                    class="form-input" 
                    value="{{ current_weight }}" 
                    required 
                    min="30" max="300"
                />
            </div>
            
            <button type="submit" class="submit-btn" id="submitBtn">
                Save Weigh-in
            </button>
        </form>

        <a href="{% url 'dashboard' %}" class="cancel-btn">Back to Dashboard</a>
    </div>
    <script>
        document.getElementById('submitBtn').addEventListener('click', function(e) {
            const weight = document.getElementById('weight').value;
            if(!weight || weight <= 0) {
                e.preventDefault();
                alert('Please enter a valid weight.');
            } else {
                this.textContent = 'Saving...';
                this.style.opacity = '0.8';
                this.style.pointerEvents = 'none';
            }
        });
    </script>
</body>
</html>
